{% extends "base.html" %}

{% block contenido %}
<h2>Consultar Clientes</h2>

<div style="margin-bottom: 20px; display: flex; gap: 10px;">
    <input type="text" id="buscar" placeholder="Buscar por Nombre, Apellido o DNI..." style="padding: 6px; width: 300px;">
    <a href="registrar_cliente.html">
        <button type="button" style="background-color: #28a745; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px;">
            + Registrar Nuevo Cliente
        </button>
    </a>
</div>

<table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th>DNI</th>
            <th>Nombres y Apellidos</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla-busqueda">
        <!-- Se llena dinámicamente -->
    </tbody>
</table>

<script>
function renderizarTabla(lista) {
    const tbody = document.getElementById('tabla-busqueda');
    tbody.innerHTML = '';

    if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No se encontraron clientes.</td></tr>';
        return;
    }

    lista.forEach(cliente => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${cliente.dni}</td>
            <td>${cliente.nombres} ${cliente.apellidos}</td>
            <td>${cliente.telefono || '-'}</td>
            <td>${cliente.correo || '-'}</td>
            <td style="text-align: center;">
                <a href="editar_cliente.html?id=${cliente.id}">
                    <button type="button" style="background-color: #ffc107; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">
                        Editar
                    </button>
                </a>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
    renderizarTabla(clientes);

    document.getElementById('buscar').addEventListener('input', function(e) {
        const termino = e.target.value.toLowerCase().trim();
        const filtrados = clientes.filter(cliente => {
            const nombreCompleto = `${cliente.nombres} ${cliente.apellidos}`.toLowerCase();
            return nombreCompleto.includes(termino) || cliente.dni.toLowerCase().includes(termino);
        });
        renderizarTabla(filtrados);
    });
});
</script>
{% endblock %}
