{% extends "base.html" %}

{% block contenido %}
<h2>Módulo de Clientes</h2>

<!-- Mensaje de alerta -->
<div id="mensaje-alerta" style="display: none; margin-bottom: 15px; font-weight: bold;"></div>

<!-- Formulario de Registro -->
<form id="form-registrar-cliente">
    <h3>Registrar Nuevo Cliente</h3>
    <div>
        <label for="nombres">Nombres:</label>
        <input type="text" id="nombres" name="nombres" required>
    </div>
    <br>
    <div>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>
    </div>
    <br>
    <div>
        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" maxlength="8" pattern="[0-9]{8}" required>
    </div>
    <br>
    <div>
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono">
    </div>
    <br>
    <div>
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo">
    </div>
    <br>
    <button type="submit">Guardar Cliente</button>
</form>

<hr>

<!-- Lista de Clientes Registrados con Botón para Editar -->
<h3>Lista de Clientes</h3>
<table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th>DNI</th>
            <th>Nombres y Apellidos</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla-clientes">
        <!-- Se llena dinámicamente con JS -->
    </tbody>
</table>

<script>
function cargarTablaClientes() {
    const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
    const tbody = document.getElementById('tabla-clientes');
    tbody.innerHTML = '';

    if (clientes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay clientes registrados.</td></tr>';
        return;
    }

    clientes.forEach(cliente => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${cliente.dni}</td>
            <td>${cliente.nombres} ${cliente.apellidos}</td>
            <td>${cliente.telefono || '-'}</td>
            <td>${cliente.correo || '-'}</td>
            <td style="text-align: center;">
                <a href="editar_cliente.html?id=${cliente.id}">
                    <button type="button" style="background-color: #ffc107; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">
                        Editar
                    </button>
                </a>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

document.addEventListener('DOMContentLoaded', cargarTablaClientes);

document.getElementById('form-registrar-cliente').addEventListener('submit', function(e) {
    e.preventDefault();

    const nombres = document.getElementById('nombres').value.trim();
    const apellidos = document.getElementById('apellidos').value.trim();
    const dni = document.getElementById('dni').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const correo = document.getElementById('correo').value.trim();
    const alerta = document.getElementById('mensaje-alerta');

    if (!nombres || !apellidos || !dni) {
        alerta.style.color = "red";
        alerta.innerText = "Por favor, completa todos los campos obligatorios (*).";
        alerta.style.display = "block";
        return;
    }

    let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
    
    if (clientes.some(c => c.dni === dni)) {
        alerta.style.color = "red";
        alerta.innerText = "Error: El DNI " + dni + " ya se encuentra registrado.";
        alerta.style.display = "block";
        return;
    }

    const nuevoCliente = { id: Date.now(), nombres, apellidos, dni, telefono, correo };
    clientes.push(nuevoCliente);
    localStorage.setItem('clientes', JSON.stringify(clientes));

    alerta.style.color = "green";
    alerta.innerText = "¡Cliente registrado con éxito!";
    alerta.style.display = "block";
    document.getElementById('form-registrar-cliente').reset();
    cargarTablaClientes();
});
</script>
{% endblock %}
