
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Reserva - SGR</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>Sistema de Gestión de Reservas</h1>
    <h2>Registrar reserva</h2>

    <p><a href="../index.html">Volver al inicio</a></p>

    <form id="form-reserva">
        <label for="cliente">Cliente</label><br>
        <select id="cliente" required>
            <option value="">Seleccione un cliente</option>
        </select>
        <br><br>

        <label for="servicio">Servicio</label><br>
        <select id="servicio" required>
            <option value="">Seleccione un servicio</option>
        </select>
        <br><br>

        <label for="fecha">Fecha</label><br>
        <input type="date" id="fecha" required>
        <br><br>

        <label for="hora">Hora</label><br>
        <input type="time" id="hora" required>
        <br><br>

        <button type="submit">Registrar reserva</button>
    </form>

    <p id="mensaje"></p>

    <script>
        const selectCliente = document.getElementById("cliente");
        const selectServicio = document.getElementById("servicio");
        const mensaje = document.getElementById("mensaje");

        function cargarDatos() {
            const clientes = JSON.parse(
                localStorage.getItem("clientes") || "[]"
            );

            const servicios = JSON.parse(
                localStorage.getItem("sgr_servicios") || "[]"
            );

            clientes.forEach(function(cliente) {
                const opcion = document.createElement("option");
                opcion.value = cliente.id;
                opcion.textContent =
                    cliente.dni + " - " +
                    cliente.nombres + " " + cliente.apellidos;
                selectCliente.appendChild(opcion);
            });

            servicios.forEach(function(servicio) {
                const opcion = document.createElement("option");
                opcion.value = servicio.id;
                opcion.textContent =
                    servicio.nombre + " - S/ " +
                    Number(servicio.precio).toFixed(2);
                selectServicio.appendChild(opcion);
            });
        }

        const ahora = new Date();
        const hoy = ahora.getFullYear() + "-" +
            String(ahora.getMonth() + 1).padStart(2, "0") + "-" +
            String(ahora.getDate()).padStart(2, "0");

        document.getElementById("fecha").min = hoy;

        document.getElementById("form-reserva").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const clienteId = selectCliente.value;
                const servicioId = selectServicio.value;
                const fecha = document.getElementById("fecha").value;
                const hora = document.getElementById("hora").value;

                if (!clienteId || !servicioId || !fecha || !hora) {
                    mensaje.style.color = "red";
                    mensaje.textContent = "Complete todos los campos.";
                    return;
                }

                if (fecha < hoy) {
                    mensaje.style.color = "red";
                    mensaje.textContent =
                        "La fecha no puede ser anterior a hoy.";
                    return;
                }

                const reservas = JSON.parse(
                    localStorage.getItem("sgr_reservas") || "[]"
                );

                reservas.push({
                    id: Date.now(),
                    cliente_id: Number(clienteId),
                    servicio_id: Number(servicioId),
                    fecha: fecha,
                    hora: hora,
                    estado: "Activa"
                });

                localStorage.setItem(
                    "sgr_reservas",
                    JSON.stringify(reservas)
                );

                mensaje.style.color = "green";
                mensaje.textContent = "Reserva registrada correctamente.";
                this.reset();
            }
        );

        cargarDatos();
    </script>

</body>
</html>
