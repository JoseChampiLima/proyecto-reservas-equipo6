<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Servicio - SGR</title>
</head>
<body>

    <h1>Sistema de Gestión de Reservas</h1>
    <h2>Registrar nuevo servicio</h2>

    <form id="formServicio">

        <label for="nombre">Nombre del servicio:</label>
        <input type="text" id="nombre" required>
        <br><br>

        <label for="precio">Precio del servicio (S/):</label>
        <input type="number" id="precio" step="0.01" required>
        <br><br>

        <label for="duracion">Duración en minutos:</label>
        <input type="number" id="duracion" required>
        <br><br>

        <button type="submit">Registrar servicio</button>

    </form>

    <p id="mensaje"></p>

    <script>
        document.getElementById("formServicio")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const precio = Number(document.getElementById("precio").value);
            const duracion = Number(document.getElementById("duracion").value);

            const servicios = JSON.parse(
                localStorage.getItem("sgr_servicios") || "[]"
            );

            servicios.push({
                id: Date.now(),
                nombre: nombre,
                precio: precio,
                duracion_minutos: duracion
            });

            localStorage.setItem(
                "sgr_servicios",
                JSON.stringify(servicios)
            );

            document.getElementById("mensaje").textContent =
                "Servicio registrado correctamente";

            document.getElementById("formServicio").reset();
        });
    </script>

</body>
</html>
